[theme]
base = "light"
primaryColor = "#7A1733"
backgroundColor = "#F7F5EF"
secondaryBackgroundColor = "#F1F6F9"
textColor = "#18324A"
linkColor = "#1F5F8B"
borderColor = "#CBD8E2"
dataframeHeaderBackgroundColor = "#E6F0F7"
codeBackgroundColor = "#F2F6F9"
showSidebarBorder = true
baseRadius = "0.65rem"
font = "sans-serif"

[client]
toolbarMode = "minimal"

[server]
# Em MiB: o Streamlit multiplica este valor por 1024*1024. Espelha exatamente
# _seguranca_xlsx.TAMANHO_MAXIMO_ARQUIVO (20 MiB), para que o transporte recuse
# o excesso pelo Content-Length antes de bufferizar o corpo da requisicao.
maxUploadSize = 20
