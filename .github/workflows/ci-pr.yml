name: CI PR

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci-rapido:
    name: CI rapido
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Obter repositorio
        uses: actions/checkout@v7
        with:
          # HEAD^1 = base: no pull_request o HEAD e o merge do PR sobre main;
          # no push em main, o merge commit. A guarda compara os dois.
          fetch-depth: 2

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest==8.4.1

      - name: Verificar sintaxe Python
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pycache
        run: python -m compileall -q .

      - name: Guarda de versionamento
        # Regra em docs/VERSIONAMENTO.md: alteracao user-facing exige
        # CL8US_VERSION; alteracao da Coleta exige COLETA_VERSION (no mesmo PR).
        run: python tools/verificar_versionamento.py --base HEAD^1

      - name: Executar testes sentinela
        run: |
          python -m pytest -q \
            tests/test_data_exata_adiantado.py \
            tests/test_timeline_ciclos_visual.py \
            tests/test_26j_aditivos_vta_documentos.py \
            tests/test_invalidacao_estado_caso.py \
            tests/test_aditivos_dropdown_h.py \
            tests/test_preserva_dropdowns_e_colunas_ocultas.py \
            tests/test_seguranca_xlsx.py \
            tests/test_geometria_workbook_p0.py \
            tests/test_contexto_coleta_perf_arch.py \
            tests/test_diagnostico_indices.py \
            tests/test_icti_fallback_local.py \
            tests/test_atualizar_icti_ipeadata.py \
            tests/test_alinhamento_template_runtime.py \
            tests/test_itens_remanesc_fotografia_exata.py \
            tests/test_resultados_final_1.py \
            tests/test_vta_pc_composicao.py \
            tests/test_vta_potencial_pc.py \
            tests/test_xls_pc_vta_align_1.py \
            tests/test_consumo_glosa_1.py \
            tests/test_consumo_glosa_dv_1.py \
            tests/test_percentual_oficial_duas_casas.py \
            tests/test_protecao_formulas_itens_pc.py \
            tests/test_termo_apostila_ajustes_consolidados.py \
            tests/test_verificar_versionamento.py \
            tests/test_versionamento_cl8us_coleta_11.py
