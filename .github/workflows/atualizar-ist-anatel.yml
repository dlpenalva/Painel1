name: Atualizar IST pela Anatel

on:
  schedule:
    # 09:15 em Brasília nos dias 10, 15 e 20 de cada mês.
    - cron: "15 12 10,15,20 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: atualizar-ist-anatel
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependência de rede
        run: python -m pip install requests==2.32.5

      - name: Testar o atualizador
        run: python -m unittest tests.test_atualizar_ist_anatel -v

      - name: Consultar a Anatel e atualizar a base
        run: python tools/atualizar_ist_anatel.py

      - name: Abrir PR somente se houver nova competência
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          ALTERADOS="$(git status --porcelain | awk '{print $2}')"
          if [ -z "$ALTERADOS" ]; then
            echo "A base já está atualizada."
            exit 0
          fi
          if [ "$ALTERADOS" != "ist.csv" ]; then
            echo "::error::Atualização abortada: arquivo inesperado alterado."
            echo "Arquivos alterados:"
            echo "$ALTERADOS"
            exit 1
          fi

          PR_ABERTO="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("automation/atualiza-ist-anatel-"))] | length')"
          if [ "$PR_ABERTO" -gt 0 ]; then
            echo "Já existe PR aberto da automação de IST; nenhum PR novo será criado."
            exit 0
          fi

          COMPETENCIA_ANTERIOR="$(git show HEAD:ist.csv | tail -n 1 | cut -d';' -f1)"
          NOVAS_LINHAS="$(git diff --unified=0 -- ist.csv | grep -E '^\+[^+]' | sed 's/^+//')"

          BRANCH="automation/atualiza-ist-anatel-${GITHUB_RUN_ID}"
          git config user.name "cl8us-ist-bot"
          git config user.email "cl8us-ist-bot@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -- ist.csv
          git commit -m "Atualiza IST pela fonte oficial da Anatel"
          git push origin "$BRANCH"

          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$BRANCH" \
            --title "Atualiza IST pela fonte oficial da Anatel" \
            --body "$(cat <<EOF
          Atualização automática do \`ist.csv\` pela fonte oficial da Anatel.

          - Competência anterior: ${COMPETENCIA_ANTERIOR}
          - Competência(s) nova(s):
          ${NOVAS_LINHAS}
          - Fonte: https://www.gov.br/anatel/pt-br/regulado/competicao/tarifas-e-precos/valores-do-ist
          - Somente \`ist.csv\` foi modificado nesta alteração.
          - Gerado pelo workflow \`Atualizar IST pela Anatel\`, run ${GITHUB_RUN_ID} (${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}).

          Merge manual/autorizado apenas — este PR não é mesclado automaticamente.
          EOF
          )"
